    <meta name="description" content="Trading journal that offers a variety of features from analytics to trade history">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icons=candlestick_chart,add_2" defer crossorigin/>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" defer crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" defer crossorigin>

    <title>Trading Journal</title>

  <body>
    <!-- <div id="root"></div>

    <!-- TODO: Don't forget to add assigned width and height to image to improve performance -->

    <!-- The goal is to mockup all pages in HTML to after apply responsive style
    Once done, I can break the code into components and containers to make them interactive with React -->

    <header role="banner">
      <div class="icon-title-container">
          <span class="material-symbols-outlined website-icon" alt="Trading journal icon" loading="lazy">candlestick_chart</span>
          <h2 class="website-title">Trading Journal</h2>
      </div>

      <nav aria-label="Website navigation">
        <a href="/" aria-current="page" class="nav-link nav-link-active">Dashboard</a>
        <a href="/journal" class="nav-link">Journal</a>
        <a href="/analytics" class="nav-link">Analytics</a>
      </nav>

      <div class="profile-container">
        <a href="/profile" class="profile-link" aria-label="View user profile">
          <!-- <img class="profile-picture" src="" alt="User profile picture" loading="lazy"> -->
        </a>
      </div>
    </header>
    
    <main class="analytics-page">
      <section class="main-heading-section" aria-labelledby="main-heading">
        <h1 id="main-heading">Analytics</h1>
        <p class="main-heading-text">Discover you results in a simple way</p>
      </section>

      <div class="analytics-grid">
        <div class="analytics-sub-left-grid">
          <section class="analytic-section" aria-labelledby="monthly-results-heading">
            <h2 id="monthly-results-heading">Monthly results</h2>
            <img src="" alt="Monthly results graph" loading="lazy">
          </section>

          <section class="analytic-section" aria-labelledby="weekly-results-heading">
            <h2 id="weekly-results-heading">Weekly results</h2>
            <img src="" alt="Weekly results graph" loading="lazy">
          </section>

          <section class="analytic-section" aria-labelledby="biggest-win-heading">
            <h2 id="biggest-win-heading">Biggest win</h2>
            <img src="" alt="Biggest win graph" loading="lazy">
          </section>
        </div>

        <div class="analytics-sub-right-grid">
          <section class="analytic-section" aria-labelledby="account-grow-heading">
            <h2 id="account-grow-heading">Account grow</h2>
            <img src="" alt="Account grow graph" loading="lazy">
          </section>

          <section class="analytic-section" aria-labelledby="average-win-loss-heading">
            <h2 id="average-win-loss-heading">Average win/loss</h2>
            <img src="" alt="Average win/loss graph" loading="lazy">
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
