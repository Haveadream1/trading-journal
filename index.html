<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Journal</title>
  </head>
  <body>
    <!-- <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script> -->

    <!-- TODO: Don't forget to add assigned width and height to image to improve performance -->

    <!-- The goal is to mockup all pages in HTML to after apply responsive style
    Once done, I can break the code into components and containers to make them interactive with React -->

    <header role="banner">
      <div class="icon-title-container">
          <img class="website-icon" src="" alt="Trading journal icon" loading="lazy">
          <h2 class="website-title">Trading Journal</h2>
      </div>

      <nav aria-label="Website navigation">
        <a href="/" aria-current="page" class="nav-link active">Dashboard</a>
        <a href="/journal" class="nav-link">Journal</a>
        <a href="/analytics" class="nav-link">Analytics</a>
      </nav>

      <a href="/profile" class="profile-link" aria-label="View user profile">
        <img class="profile-picture" src="" alt="User profile picture" loading="lazy">
      </a>
    </header>

    <main>
      <section class="main-heading-section" aria-labelledby="main-heading">
        <h1 id="main-heading">Trades journal</h1>
        <p class="main-heading-text">A complete history of your recent trades</p>
      </section>

      <table>
        <thead>
          <tr class="table-heading-row">
            <th>Date</th>
            <th>Asset</th>
            <th>Direction</th>
            <th>Outcome</th>
            <th>Net P/L</th>
          </tr>
        </thead>

        <tbody>
          <tr class="table-values-row">
            <td class="table-date-value">24/05/2025</td>
            <td class="table-asset-value">BTC / USD</td>
            <td class="table-direction-value">BUY</td>
            <td class="table-outcome-value">WIN</td>
            <td class="table-net-pl-value">+2,505.20$</td>
          </tr>

          <tr class="table-values-row">
            <td class="table-date-value">25/05/2025</td>
            <td class="table-asset-value">ETH / USD</td>
            <td class="table-direction-value">SELL</td>
            <td class="table-outcome-value">WIN</td>
            <td class="table-net-pl-value">+1,505.20$</td>
          </tr>
        </tbody>
      </table>

      <button type="button" class="add-new-trade-button">
        <img src="" alt="Add a new trade icon" aria-label="Add a new trade" loading="lazy">
      </button>
    </main>
  </body>
</html>
